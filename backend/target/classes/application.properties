spring.application.name=payment-gateway-api
server.port=8000

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Logging
logging.level.root=INFO
logging.level.com.paymentgateway=DEBUG

# App-specific configuration (via env)
# Maps from env vars like APP_TEST_MODE -> app.test-mode
# Provided via docker-compose

# Test Mode Configuration
app.test-mode=false
app.test-processing-delay=1000
app.test-payment-success=true
app.upi-success-rate=0.90
app.card-success-rate=0.95
app.processing-delay-min=5000
app.processing-delay-max=10000

# CORS Configuration
app.allowed-origins=http://localhost:3000,http://localhost:3001
