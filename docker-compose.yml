services:
  postgres:
    image: postgres:15-alpine
    container_name: pg_gateway
    environment:
      POSTGRES_DB: payment_gateway
      POSTGRES_USER: gateway_user
      POSTGRES_PASSWORD: gateway_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway_user -d payment_gateway"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    container_name: gateway_api
    ports:
      - "8000:8000"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_gateway
      SPRING_DATASOURCE_USERNAME: gateway_user
      SPRING_DATASOURCE_PASSWORD: gateway_pass
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
      TEST_MERCHANT_EMAIL: test@example.com
      TEST_API_KEY: key_test_abc123
      TEST_API_SECRET: secret_test_xyz789
      APP_UPI_SUCCESS_RATE: 0.90
      APP_CARD_SUCCESS_RATE: 0.95
      APP_PROCESSING_DELAY_MIN: 5000
      APP_PROCESSING_DELAY_MAX: 10000
      APP_TEST_MODE: ${TEST_MODE:-false}
      APP_TEST_PAYMENT_SUCCESS: ${TEST_PAYMENT_SUCCESS:-true}
      APP_TEST_PROCESSING_DELAY: ${TEST_PROCESSING_DELAY:-1000}
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: ./frontend
    container_name: gateway_dashboard
    ports:
      - "3000:80"
    environment:
      REACT_APP_API_URL: http://localhost:8000
    depends_on:
      - api

  checkout:
    build:
      context: ./checkout-page
    container_name: gateway_checkout
    ports:
      - "3001:80"
    environment:
      REACT_APP_API_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  postgres_data:
