name: Automated Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: payment_gateway
          POSTGRES_USER: gateway_user
          POSTGRES_PASSWORD: gateway_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test (Backend)
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/payment_gateway
          SPRING_DATASOURCE_USERNAME: gateway_user
          SPRING_DATASOURCE_PASSWORD: gateway_pass
        run: |
          mvn clean test -DskipTests=false
          mvn jacoco:report

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: backend/target/site/jacoco/jacoco.xml
          flags: backend
          name: backend-coverage

  frontend-tests:
    name: Frontend Component Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies (Dashboard)
        working-directory: frontend
        run: npm ci

      - name: Run Tests (Dashboard)
        working-directory: frontend
        run: npm test -- --coverage --passWithNoTests

      - name: Upload Frontend Coverage
        uses: codecov/codecov-action@v3
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage

  checkout-tests:
    name: Checkout Page Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: checkout-page/package-lock.json

      - name: Install Dependencies (Checkout)
        working-directory: checkout-page
        run: npm ci

      - name: Run Tests (Checkout)
        working-directory: checkout-page
        run: npm test -- --coverage --passWithNoTests

      - name: Upload Checkout Coverage
        uses: codecov/codecov-action@v3
        with:
          files: checkout-page/coverage/lcov.info
          flags: checkout
          name: checkout-coverage

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [ backend-tests, frontend-tests, checkout-tests ]
    if: success()

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build API Image
        uses: docker/build-push-action@v4
        with:
          context: backend
          push: false
          tags: payment-gateway-api:test

      - name: Build Dashboard Image
        uses: docker/build-push-action@v4
        with:
          context: frontend
          push: false
          tags: payment-gateway-dashboard:test

      - name: Build Checkout Image
        uses: docker/build-push-action@v4
        with:
          context: checkout-page
          push: false
          tags: payment-gateway-checkout:test

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [ backend-tests, frontend-tests, checkout-tests ]
    if: always()

    steps:
      - name: Print Results
        run: |
          echo "Backend Tests: ${{ needs.backend-tests.result }}"
          echo "Frontend Tests: ${{ needs.frontend-tests.result }}"
          echo "Checkout Tests: ${{ needs.checkout-tests.result }}"
          if [ "${{ needs.backend-tests.result }}" == "failure" ] || [ "${{ needs.frontend-tests.result }}" == "failure" ] || [ "${{ needs.checkout-tests.result }}" == "failure" ]; then
            exit 1
          fi
